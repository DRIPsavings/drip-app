name: DRIP - Nuclear Clean Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 🔥 ULTRA NUCLEAR CACHE DESTROY
        run: |
          echo "=== KILLING ALL CACHES ==="
          flutter clean
          rm -rf build/ .dart_tool/ pubspec.lock android/.gradle android/app/build android/build
          rm -rf ~/.gradle/caches ~/.pub-cache ~/.dartServer
          cd android && ./gradlew --stop 2>/dev/null || true
          cd ..

      - name: Fresh pub get
        run: flutter pub get

      - name: Accept licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Release APK (Force no cache)
        run: |
          flutter build apk --release \
            --no-pub \
            --build-number=$(date +%s) \
            --build-name=1.0.$(date +%s)

      - name: Upload Fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: drip-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
