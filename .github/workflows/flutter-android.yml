name: DRIP - Nuclear Clean Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 🔥 NUCLEAR CACHE WIPE - Flutter will shit its pants
        run: |
          echo "=== FORCING COMPLETE CLEAN ==="
          flutter clean
          rm -rf build/ .dart_tool/ pubspec.lock android/.gradle android/app/build android/build
          rm -rf ~/.gradle ~/.pub-cache ~/.dartServer
          echo "All known Flutter/Gradle caches deleted"

      - name: Fresh pub get
        run: flutter pub get

      - name: Accept licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Release APK (Fresh every time)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drip-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
