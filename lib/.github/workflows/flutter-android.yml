name: Flutter Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'   # Latest stable (you can pin e.g. '3.29.0' if you prefer)
          channel: 'stable'
          cache: true

      - name: Install Android NDK (fixes google_maps_flutter & speech_to_text)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Debug APK (with clean .png buttons)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drip-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30