name: drip
description: "DRIP — Real Drink Specials Near You."
publish_to: 'none'
version: 1.0.6+7   # ← Increased for fresh build

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  share_plus: ^10.0.0
  google_maps_flutter: ^2.12.3
  url_launcher: ^6.3.0
  speech_to_text: ^7.3.0
  geolocator: ^13.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    # Splash
    - assets/splash.png
    
    # Greeting voices
    - assets/greetings/
    
    # Home screen buttons
    - assets/smoothie_button.png
    - assets/coffee_button.png
    - assets/party_button.png
    - assets/instant_alerts.png
    - assets/selfie_share.jpg
    - assets/family_mode_button.png