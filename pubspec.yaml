name: drip
description: "DRIP — Real Drink Specials Near You."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  share_plus: ^10.0.0
  google_maps_flutter: ^2.12.3
  url_launcher: ^6.3.0
  speech_to_text: ^7.3.0
  geolocator: ^13.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash.png
    - assets/party_button.png
    - assets/coffee_button.png
    - assets/smoothie_button.png
    - assets/instant_alerts.png
    - assets/selfie_share.jpg
    - assets/drip_logo.png
    - assets/family_mode_button.png
    - assets/party.mp3
    - assets/coffee.mp3
    - assets/smoothie.mp3
    - assets/alerts.mp3
    - assets/selfie.mp3